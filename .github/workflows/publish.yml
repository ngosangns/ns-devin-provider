name: Publish

# Publishes all three packages to npm via trusted publishing (OIDC): no npm
# token is stored anywhere, and no 2FA prompt blocks the run. npm verifies the
# workflow identity instead, so the trusted publisher registered on npmjs.com
# must name this repository AND this file (.github/workflows/publish.yml).
#
# Trigger by pushing a tag that matches the version in package.json:
#   git tag v0.2.0 && git push origin v0.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not publish"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: [self-hosted, macmini]
    permissions:
      # Required for OIDC: this is what npm trusts in place of a token.
      # (Provenance attestation is not available — sigstore only accepts
      # github-hosted runners, and this job runs on the self-hosted macmini.)
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Node 22 ships npm 10, which predates trusted publishing.
      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # `check` typechecks against built declarations, so the build comes first.
      - run: pnpm -r build
      - run: pnpm -r check
      - run: pnpm test

      # A tag that disagrees with package.json would publish a version nobody
      # asked for, under a tag pointing at different code. Refuse instead.
      - name: Verify the tag matches every package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in packages/*/package.json; do
            VERSION=$(node -p "require('./$pkg').version")
            if [ "$VERSION" != "$TAG" ]; then
              echo "Tag $TAG != $pkg version $VERSION"
              exit 1
            fi
          done
          echo "Tag $TAG matches all package versions"

      - run: pnpm -r publish --access public --no-git-checks ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ""
